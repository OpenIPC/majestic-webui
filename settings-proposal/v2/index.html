<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majestic Settings navigation — proposal for issue #163</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* ── tokens lifted from www/a/bootstrap.override.css ───────────────────── */
:root {
  --bg: #14161c; --fg: #e6e8ee; --sec-bg: #1c1f27; --ter-bg: #232734;
  --card: #1c1f27; --border: #2c313d;
  --primary: rgb(92, 112, 232); --primary-hi: rgb(110, 130, 245);
  --sec-color: rgba(230, 232, 238, .75); --ter-color: rgba(230, 232, 238, .5);
  --navbar: #232734; --warning: #ffc107; --danger: #dc3545;
  --knob-off: rgba(255, 255, 255, .25);
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
[data-t="light"] {
  --bg: #f4f5f9; --fg: #1f2430; --sec-bg: #eceef4; --ter-bg: #f8f9fa;
  --card: #ffffff; --border: #e2e5ee;
  --primary: rgb(76, 96, 216); --primary-hi: rgb(60, 80, 200);
  --sec-color: rgba(31, 36, 48, .75); --ter-color: rgba(31, 36, 48, .5);
  --navbar: rgb(76, 96, 216); --knob-off: rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
body { margin: 0; background: #0e1014; color: #e6e8ee; font-family: var(--font); }

/* ── the chooser bar; not part of the proposal, just the harness ───────── */
.bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center;
  gap: 10px 18px; padding: 12px 18px; background: #0e1014; border-bottom: 1px solid #262b36; }
.bar h1 { margin: 0 12px 0 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.bar .lede { flex: 1 1 100%; order: 9; margin: 0; font-size: 13px; line-height: 19px; color: #8c93a3; }
.bar .lede a { color: #7f8ff0; }
.seg { display: inline-flex; border: 1px solid #2c313d; border-radius: 8px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; color: #b9bfcc;
  font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid #2c313d; }
.seg button[aria-pressed="true"] { background: rgb(92,112,232); color: #fff; }
.note { padding: 14px 18px; font-size: 13px; line-height: 20px; color: #98a0b0;
  background: #12151b; border-bottom: 1px solid #262b36; }
.note b { color: #d6dbe6; font-weight: 600; }

.stage { display: flex; justify-content: center; padding: 28px 18px 60px; overflow-x: auto; }
.frame { flex: 0 0 auto; border: 1px solid #262b36; border-radius: 12px; overflow: hidden; }

/* ── the mockup itself ─────────────────────────────────────────────────── */
.mj { background: var(--bg); color: var(--fg); font-size: 16px; line-height: 1.5; }
.mj a { color: var(--primary); text-decoration: none; }
.mj .nav { background: var(--navbar); padding: 8px 0; }
.mj .wrap { max-width: 1320px; margin: 0 auto; padding: 0 12px; }
.mj .navrow { display: flex; align-items: center; }
.mj .navitem { padding: 8px; color: #fff; font-size: 16px; }
.mj .caret { width: 0; height: 0; border-top: 5px solid #fff; border-left: 5px solid transparent;
  border-right: 5px solid transparent; margin: 0 8px 0 -4px; }
.mj .sig { display: flex; align-items: flex-start; gap: 24px; font-size: 13px; margin-top: 4px; }
.mj .pb { height: 4px; border-radius: 8px; background: var(--sec-bg); margin: 4px 0; }
.mj .pb > i { display: block; height: 4px; border-radius: 8px; background: var(--primary); }
.mj h2 { color: var(--primary); font-size: 32px; font-weight: 500; line-height: 1.2; margin: 32px 0 24px; }
.mj .cols { display: flex; align-items: flex-start; gap: 24px; }

.mj .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.12); padding: 16px; margin-bottom: 24px; }
.mj .card > h3 { margin: 0 0 16px; font-size: 18.4px; font-weight: 500; line-height: 1.2; color: var(--sec-color); }
.mj .mj-cols { column-count: 2; column-gap: 40px; }
.mj h5 { break-inside: avoid; margin: 24px 0 8px; font-size: 20px; font-weight: 500;
  line-height: 1.2; color: var(--sec-color); }

.mj .row { break-inside: avoid; border-left: 2px solid transparent; padding-left: 8px; margin: 0 0 16px; }
.mj .row.dirty { border-left-color: var(--warning); }
.mj .row > label { display: block; margin-bottom: 2px; font-size: 16px; line-height: 24px; color: var(--fg); }
.mj .ctlrow { display: flex; align-items: center; gap: 8px; }
.mj .ctlrow > .ctl { flex: 1 1 auto; min-width: 0; }
.mj .reset { flex: 0 0 auto; font-size: 15px; line-height: 24px; color: var(--ter-color);
  cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
.mj .reset:hover { color: var(--primary); }
.mj .box { height: 38px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--fg); font-size: 16px; line-height: 24px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mj .num { text-align: right; }
.mj .sel { position: relative; }
.mj .sel .box { padding-right: 36px; }
.mj .sel svg { position: absolute; right: 12px; top: 15px; color: var(--sec-color); }
.mj .hint { font-size: 14px; line-height: 21px; margin-top: 3px; color: var(--sec-color); text-wrap: pretty; }
.mj .sw { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.mj .sw .track { flex: 0 0 auto; width: 32px; height: 16px; border-radius: 16px;
  border: 1px solid var(--knob-off); background: transparent; position: relative; }
.mj .sw .track > i { position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--knob-off); }
.mj .sw.on .track { border-color: var(--primary); background: var(--primary); }
.mj .sw.on .track > i { left: 17px; background: #fff; }
.mj .rng { display: flex; align-items: center; height: 40px; }
.mj .rng .trk { flex: 1 1 auto; position: relative; height: 40px; display: flex; align-items: center; }
.mj .rng .trk > u { width: 100%; height: 8px; border-radius: 16px; background: var(--ter-bg); }
.mj .rng .trk > b { position: absolute; top: 12px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--primary); box-shadow: 0 1.6px 4px rgba(0,0,0,.1); }
.mj .rng .val { flex: 0 0 56px; text-align: center; padding-left: 4px; font-size: 16px; color: var(--sec-color); }
.mj .arr { display: flex; margin-bottom: 4px; }
.mj .arr .box { flex: 1 1 auto; height: 31px; padding: 4px 8px; border-right: 0;
  border-radius: 6px 0 0 6px; font-size: 14px; line-height: 21px; }
.mj .arr .del { flex: 0 0 auto; height: 31px; padding: 4px 10px; border: 1px solid var(--danger);
  border-radius: 0 6px 6px 0; color: var(--danger); font-size: 14px; line-height: 21px; }
.mj .ghost { display: inline-block; padding: 4px 8px; border: 1px solid var(--sec-color);
  border-radius: 6px; color: var(--sec-color); font-size: 14px; line-height: 21px; }
.mj .roi { position: relative; width: 100%; aspect-ratio: 16/9; border: 1px solid var(--primary);
  border-radius: 8px; background: #0b0d12; overflow: hidden; }
.mj .roi > i { position: absolute; border: 2px solid var(--warning); background: rgba(255,193,7,.12); }
.mj .video { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--primary); border-radius: 8px; }

.mj .search { position: relative; margin-bottom: 14px; }
.mj .search input { width: 100%; height: 38px; padding: 6px 32px 6px 34px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); color: var(--fg); font-family: inherit; font-size: 15px;
  line-height: 24px; outline: none; }
.mj .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 .2rem rgba(92,112,232,.35); }
.mj .search input::placeholder { color: var(--ter-color); }
.mj .search .ico { position: absolute; left: 11px; top: 11px; color: var(--ter-color); }
.mj .search .clr { position: absolute; right: 10px; top: 7px; color: var(--sec-color); cursor: pointer; }
.mj mark { background: rgba(255,193,7,.28); color: inherit; border-radius: 2px; padding: 0 1px; }
[data-t="light"] .mj mark, .mj[data-t="light"] mark { background: rgba(255,193,7,.55); }
.mj .navlink.sub { padding-left: 22px; display: flex; align-items: center; gap: 8px; }
.mj .navlink .n { margin-left: auto; font-size: 12px; color: var(--ter-color); }
.mj .navlink.on .n { color: rgba(255,255,255,.8); }
.mj .btn.warn { background: var(--warning); color: #1f2430; }
.mj .btn { border: 0; font-family: inherit; cursor: pointer; }
.mj .btn.off { cursor: default; }
.mj .empty { padding: 6px 10px; font-size: 14px; color: var(--ter-color); }
.mj .cap { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ter-color); padding: 0 10px; margin-bottom: 5px; }
.mj .navlink { display: block; padding: 5px 10px; margin-bottom: 2px; border-radius: 8px;
  font-size: 14px; line-height: 21px; color: var(--sec-color); cursor: pointer; }
.mj .navlink:hover { background: var(--ter-bg); color: var(--fg); }
.mj .navlink.on { background: var(--primary); color: #fff; font-weight: 500; }
.mj .navlink.on:hover { background: var(--primary); color: #fff; }
.mj .rail .navlink { padding: 8px 16px; }
.mj .hit { display: block; padding: 6px 10px; margin-bottom: 2px; border-radius: 8px; cursor: pointer; }
.mj .hit:hover { background: var(--ter-bg); }
.mj .hit b { display: block; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mj .hit s { display: block; font-size: 12px; line-height: 18px; color: var(--ter-color); text-decoration: none; }
.mj .hit.on { background: var(--primary); }
.mj .hit.on b { color: #fff; font-weight: 500; }
.mj .hit.on s { color: rgba(255,255,255,.8); }
.mj .tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 20px;
  border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.mj .tab { padding: 8px 0; margin-bottom: -1px; border-bottom: 2px solid transparent;
  font-size: 15px; line-height: 22px; color: var(--sec-color); cursor: pointer; }
.mj .tab:hover { color: var(--fg); }
.mj .tab.on { border-bottom-color: var(--primary); color: var(--fg); font-weight: 600; }
.mj .toolbar { padding: 12px 0; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.mj .toolbar span { margin-right: auto; font-size: 14px; color: var(--sec-color); }
.mj .btn { padding: 6px 12px; border-radius: 8px; background: var(--primary); color: #fff;
  font-size: 16px; line-height: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.mj .btn.off { opacity: .65; }
.mj .acc { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
  font-size: 14px; line-height: 21px; font-weight: 600; color: var(--fg); cursor: pointer; }
.mj .acc:hover { background: var(--ter-bg); }
.mj .acc .tri { flex: 0 0 auto; width: 0; height: 0; border-left: 5px solid currentColor;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent; opacity: .55; }
.mj .acc.open .tri { transform: rotate(90deg); }
.mj .acc .n { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--ter-color); }

/* ── mobile overrides ──────────────────────────────────────────────────── */
.mj.m { font-size: 16px; }
.mj.m .wrap { padding: 0 12px; }
.mj.m h2 { font-size: 25px; margin: 22px 0 16px; }
.mj.m .mj-cols { column-count: 1; }
.mj.m .card { padding: 14px; margin-bottom: 20px; }
.mj.m .card > h3 { font-size: 17px; margin-bottom: 14px; }
.mj.m h5 { font-size: 18px; margin: 22px 0 8px; }
.mj.m .row { margin-bottom: 18px; }
.mj.m .box { height: 44px; padding: 9px 12px; }
.mj.m .sel svg { top: 18px; }
.mj.m .rng, .mj.m .rng .trk { height: 44px; }
.mj.m .rng .trk > b { width: 20px; height: 20px; top: 12px; }
.mj.m .reset { width: 44px; height: 44px; margin-right: -10px; display: flex;
  align-items: center; justify-content: center; }
.mj.m .search input { height: 44px; font-size: 16px; padding: 9px 34px 9px 36px; }
.mj.m .search .ico { top: 14px; }
.mj.m .search .clr { top: 10px; }
.mj.m .listrow { display: flex; align-items: center; gap: 10px; min-height: 46px;
  border-bottom: 1px solid var(--border); cursor: pointer; }
.mj.m .listrow > b { flex: 1 1 auto; font-size: 16px; line-height: 22px; font-weight: 400; color: var(--fg); }
.mj.m .listrow > i { flex: 0 0 auto; font-size: 13px; font-style: normal; color: var(--ter-color); }
.mj.m .hitrow { display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border); cursor: pointer; }
.mj.m .hitrow b { display: block; font-size: 16px; line-height: 22px; font-weight: 400; color: var(--fg); }
.mj.m .hitrow s { display: block; font-size: 13px; line-height: 19px; color: var(--ter-color); text-decoration: none; }
.mj.m .back { display: inline-flex; align-items: center; gap: 6px; height: 44px;
  margin: -10px 0 4px; font-size: 16px; color: var(--primary); cursor: pointer; }
.mj.m .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.mj.m .tabs::-webkit-scrollbar { display: none; }
.mj.m .tab { flex: 0 0 auto; padding: 10px 0; white-space: nowrap; }
.mj.m .btn { padding: 10px 16px; line-height: 22px; }
.mj.m .toolbar span { font-size: 14px; }
</style>
</head>
<body>

<div class="bar">
  <h1>Majestic Settings — navigation proposal</h1>
  <div class="seg" id="dir">
    <button data-v="A" aria-pressed="true">A · Tree + search</button>
    <button data-v="B" aria-pressed="false">B · Rail + tabs</button>
    <button data-v="C" aria-pressed="false">C · Search-first</button>
  </div>
  <div class="seg" id="dev">
    <button data-v="d" aria-pressed="true">Desktop</button>
    <button data-v="m" aria-pressed="false">Mobile</button>
  </div>
  <div class="seg" id="thm">
    <button data-v="dark" aria-pressed="true">Dark</button>
    <button data-v="light" aria-pressed="false">Light</button>
  </div>
  <p class="lede">Three ways to make individual sections directly selectable, for
    <a href="https://github.com/OpenIPC/majestic-webui/issues/163">OpenIPC/majestic-webui#163</a>.
    Clickable: search, pick a section, toggle a switch to see the dirty state and the Save button wake up.</p>
</div>

<div class="note" id="note"></div>
<div class="stage"><div class="frame" id="stage"></div></div>

<script>
/* Sections, labels, hints, enums and current values are generated from a real
   camera's /api/v1/config.schema.json + config.json (hi3516av300 / imx415),
   through the same widget dispatch www/a/mj-settings.js uses. */
const MODEL = [
      { id: "image", label: "Image", sections: [
        { id: "live", label: "Live adjustments", fields: [
          {"k":"range","n":"luminance","l":"Brightness","lo":0,"hi":100,"v":50,"h":""},
          {"k":"range","n":"contrast","l":"Contrast","lo":0,"hi":100,"v":50,"h":""},
          {"k":"range","n":"saturation","l":"Saturation","lo":0,"hi":100,"v":50,"h":""},
          {"k":"range","n":"hue","l":"Hue","lo":0,"hi":100,"v":50,"h":""},
          {"k":"switch","n":"mirror","l":"Mirror","on":false,"h":""},
          {"k":"switch","n":"flip","l":"Flip","on":false,"h":""}
        ] },
        { id: "image", label: "Image", fields: [
          {"k":"select","n":"rotate","l":"Rotate image clockwise","v":"0","wide":false,"h":""},
          {"k":"switch","n":"tuning","l":"Automatic image tuning","on":false,"h":""}
        ] },
        { id: "isp", label: "ISP / Exposure", fields: [
          {"k":"select","n":"antiFlicker","l":"Anti-flicker","v":"disabled","wide":false,"h":"Match your mains frequency (50/60 Hz) to remove the rolling banding seen under artificial light."},
          {"k":"number","n":"drc","l":"Dynamic range compression","v":"","h":""},
          {"k":"select","n":"sensorConfig","l":"Sensor configuration file, by path or by sensor name","v":"Auto","wide":true,"h":""},
          {"k":"text","n":"iqProfile","l":"Set image quality profile","v":"","h":""},
          {"k":"select","n":"slowShutter","l":"Slow shutter mode","v":"medium","wide":false,"h":""},
          {"k":"select","n":"rawMode","l":"Mode for capturing RAW images","v":"slow","wide":false,"h":""},
          {"k":"switch","n":"dis","l":"Digital image stabilization","on":false,"h":""},
          {"k":"select","n":"memMode","l":"Reduce memory usage","v":"reduction","wide":false,"h":""},
          {"k":"switch","n":"lowDelay","l":"Reduce sensor-to-network delay","on":false,"h":""},
          {"k":"select","n":"yuvCompression","l":"VPSS frame buffer compression","v":"auto","wide":false,"h":"seg saves about a third of the main frame buffer; ignored when rotate, mirror or privacy masks are set"},
          {"k":"head","n":"iris","l":"Iris"},
          {"k":"select","n":"type","l":"Iris type","v":"none","wide":false,"h":""},
          {"k":"number","n":"blkCnt","l":"Memory blocks for hardware encoder","v":"7","h":""}
        ] },
        { id: "nightMode", label: "Day / Night", fields: [
          {"k":"switch","n":"colorToGray","l":"Colorless night mode","on":true,"h":""},
          {"k":"number","n":"irCutPin1","l":"GPIO pin1 for IRcut","v":"","h":""},
          {"k":"switch","n":"irCutSingleInvert","l":"Single IRcut is inverted","on":false,"h":""},
          {"k":"number","n":"irCutPin2","l":"GPIO pin2 for IRcut","v":"","h":""},
          {"k":"number","n":"backlightPin","l":"GPIO pin for camera light","v":"","h":""},
          {"k":"number","n":"overrideDrc","l":"DRC value in night mode","v":"","h":"Dynamic-range-compression strength applied while in night mode (overrides isp.drc). Higher lifts shadows more."},
          {"k":"switch","n":"lightMonitor","l":"Enable light monitor","on":false,"h":""},
          {"k":"number","n":"lightSensorPin","l":"GPIO pin for light sensor","v":"","h":""},
          {"k":"switch","n":"lightSensorInvert","l":"Light sensor is inverted","on":false,"h":""},
          {"k":"range","n":"monitorDelay","l":"Delay before switching day/night mode","lo":0,"hi":60,"v":0,"h":"Seconds between light checks before flipping day/night (software light monitor)."},
          {"k":"number","n":"minThreshold","l":"Minimum sensor threshold for day","v":"","h":"Compared against the sensor's analog gain (the isp_again metric). In night mode, switches back to day when gain drops below this. Units are sensor-specific — watch the live isp_again value to pick a level. Keep below maxThreshold for hysteresis."},
          {"k":"number","n":"maxThreshold","l":"Maximum sensor threshold for night","v":"","h":"Compared against the sensor's analog gain (the isp_again metric). In day mode, switches to night when gain rises above this (a darker scene needs more gain). Keep above minThreshold for hysteresis."}
        ] }
      ] },
      { id: "video", label: "Video & Audio", sections: [
        { id: "video0", label: "Main stream", fields: [
          {"k":"switch","n":"enabled","l":"Enable video","on":true,"h":""},
          {"k":"select","n":"codec","l":"Video codec","v":"h264","wide":false,"h":""},
          {"k":"select","n":"size","l":"Video resolution","v":"4K · 3840×2160 · 16:9","wide":true,"h":""},
          {"k":"number","n":"fps","l":"Video frame rate","v":"20","h":"1–120"},
          {"k":"number","n":"bitrate","l":"Video bitrate","v":"4096","h":"Target bitrate in kbit/s (e.g. 4096 = 4 Mbit/s)."},
          {"k":"select","n":"rcMode","l":"Rate control mode","v":"vbr","wide":false,"h":""},
          {"k":"select","n":"profile","l":"Video profile","v":"main","wide":false,"h":""},
          {"k":"text","n":"gopSize","l":"Keyframe interval (s)","v":"1","h":"Seconds between keyframes (I-frames): 1.0 = one per second, 2.0 = every two seconds. Larger lowers bitrate but slows seeking and error recovery."},
          {"k":"array","n":"crop","l":"Crop video to size","rows":[],"h":"Crop to one region written as XxYxWxH (top-left offset, then size). Empty = full frame."},
          {"k":"select","n":"gopMode","l":"Group of pictures mode","v":"normal","wide":false,"h":""},
          {"k":"select","n":"svct","l":"Temporal scalability layers (off, 2x, 4x)","v":"off","wide":false,"h":""},
          {"k":"range","n":"refEnhance","l":"Reference enhancement layers","lo":0,"hi":3,"v":"","h":"Raw VENC reference structure. 0 with reference prediction off makes every P frame reference the keyframe, so one lost frame costs only itself — pair it with a short keyframe interval. Needs a decoder and link that expect it; overridden by temporal scalability layers."},
          {"k":"switch","n":"refPred","l":"Reference prediction between base frames","on":false,"h":""},
          {"k":"range","n":"sliceUnits","l":"Slice size in rows","lo":0,"hi":32,"v":0,"h":"Macroblock rows (H.264) / LCU rows (H.265) per slice. 0 = disabled. Overridden by sliceBytes when that is set."},
          {"k":"number","n":"sliceBytes","l":"Target bytes per NAL slice","v":"0","h":"Splits each frame into roughly N-byte NAL slices for lower latency and loss tolerance. 0 = disabled (one slice per frame). Takes precedence over sliceUnits. · 0–2000"}
        ] },
        { id: "video1", label: "Sub stream", fields: [
          {"k":"switch","n":"enabled","l":"Enable video","on":false,"h":""},
          {"k":"select","n":"codec","l":"Video codec","v":"h264","wide":false,"h":""},
          {"k":"select","n":"size","l":"Video resolution","v":"D1 · 704×576 · 11:9","wide":true,"h":""},
          {"k":"number","n":"fps","l":"Video frame rate","v":"15","h":"1–120"},
          {"k":"number","n":"bitrate","l":"Video bitrate","v":"1024","h":"Target bitrate in kbit/s (e.g. 4096 = 4 Mbit/s)."},
          {"k":"select","n":"rcMode","l":"Rate control mode","v":"vbr","wide":false,"h":""},
          {"k":"select","n":"profile","l":"Video profile","v":"main","wide":false,"h":""},
          {"k":"text","n":"gopSize","l":"Keyframe interval (s)","v":"","h":"Seconds between keyframes (I-frames): 1.0 = one per second, 2.0 = every two seconds. Larger lowers bitrate but slows seeking and error recovery."},
          {"k":"array","n":"crop","l":"Crop video to size","rows":[],"h":"Crop to one region written as XxYxWxH (top-left offset, then size). Empty = full frame."}
        ] },
        { id: "audio", label: "Audio", fields: [

  C: '<b>C · Search-first — answers the actual complaint.</b> One flat index over every field in every section; browse collapses to an accordion. Tradeoff: furthest from today’s UI, and it only helps if you roughly know the setting’s name — which is why A and B carry the same search beside a full tree.'

const S = { dir: 'A', dev: 'd', theme: 'dark', active: 'isp', cat: 'image',
  open: 'video', q: '', view: 'list', catOpen: false, dirty: {}, saved: false,
  openA: { image: true } };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const flat = () => MODEL.flatMap((g) => g.sections.map((s) => ({ g: g, s: s })));
const find = (id) => (flat().find((x) => x.s.id === id) || flat()[0]).s;
const groupOf = (id) => (flat().find((x) => x.s.id === id) || flat()[0]).g;
const isMobile = () => S.dev === 'm';
const nFields = (s) => s.fields.filter((f) => f.k !== 'head' && f.k !== 'frame').length;

const norm = (s) => String(s == null ? '' : s).toLowerCase();
const q_ = () => S.q.trim().toLowerCase();

/* escape, then wrap the matched run in <mark> */
function mark(text, q) {
  const t = String(text == null ? '' : text);
  if (!q) return esc(t);
  const i = norm(t).indexOf(q);
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) +
    '</mark>' + esc(t.slice(i + q.length));
}

const fieldMatches = (s, q) => s.fields.filter((f) => f.k !== 'head' && f.k !== 'frame' &&
  (norm(f.l).includes(q) || norm(f.h).includes(q))).length;
const secMatchesField = (s, q) => fieldMatches(s, q) > 0;

/* the reporter's rule: a category that matches keeps all of its subsections;
   otherwise keep a subsection when its own name matches, or when any of its
   fields' names or descriptions do */
function filterTree(q) {
  if (!q) return MODEL.map((g) => ({ g: g, sections: g.sections }));
  const out = [];
  for (const g of MODEL) {
    const gm = norm(g.label).includes(q);
    const secs = gm ? g.sections
      : g.sections.filter((s) => norm(s.label).includes(q) || secMatchesField(s, q));
    if (gm || secs.length) out.push({ g: g, sections: secs });
  }
  return out;
}

function hits() {
  const q = S.q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  for (const g of MODEL) for (const s of g.sections) for (const f of s.fields) {
    if (f.k === 'head' || f.k === 'frame') continue;
    if ((f.l + ' ' + f.n + ' ' + s.label).toLowerCase().includes(q)) out.push({ g: g, s: s, f: f });
  }
  return out;
}

/* ── one field ─────────────────────────────────────────────────────────── */
function field(sec, f) {
  const key = sec.id + '.' + f.n;
  if (f.k === 'head') return '<h5>' + esc(f.l) + '</h5>';
  if (f.k === 'frame') return '<div class="row"><div class="roi">' +
    '<i style="left:6%;top:10%;width:34%;height:46%"></i>' +
    '<i style="left:58%;top:44%;width:28%;height:38%"></i></div>' +
    '<div class="ghost" style="margin-top:10px;padding:6px 12px;font-size:16px;line-height:24px">Clear all regions</div></div>';

  const dirty = S.dirty[key] !== undefined;
  const reset = '<button class="reset" title="Reset to default" data-act="reset">↺</button>';
  const q = q_();
  const hint = f.h ? '<div class="hint">' + mark(f.h, q) + '</div>' : '';
  let inner;

  if (f.k === 'switch') {
    const on = dirty ? S.dirty[key] : f.on;
    inner = '<div class="ctlrow"><div class="ctl"><div class="sw' + (on ? ' on' : '') +
      '" data-act="toggle:' + esc(key) + '"><span class="track"><i></i></span>' +
      '<span>' + mark(f.l, q) + '</span></div></div>' + reset + '</div>';
  } else {
    let c;
    if (f.k === 'range') {
      const pct = Math.round(((f.v - f.lo) / ((f.hi - f.lo) || 1)) * 100);
      c = '<div class="rng"><div class="trk"><u></u><b style="left:calc(' + pct +
        '% - 8px)"></b></div><div class="val">' + esc(f.v) + '</div></div>';
    } else if (f.k === 'number') {
      c = '<div class="box num">' + esc(f.v) + '</div>';
    } else if (f.k === 'select') {
      c = '<div class="sel"><div class="box">' + esc(f.v) + '</div>' +
        '<svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1.5 6 6.5 11 1.5" ' +
        'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
    } else if (f.k === 'array') {
      c = '<div>' + (f.rows || []).map((r) => '<div class="arr"><div class="box">' + esc(r.v) +
        '</div><div class="del">×</div></div>').join('') +
        '<div class="ghost" style="margin-top:4px">+ Add region</div></div>';
    } else {
      c = '<div class="box">' + esc(f.v) + '</div>';
    }
    /* the control keeps its own width cap so the reset glyph lands right
       after it, not stranded at the column edge */
    const cap = isMobile()
      ? (f.k === 'number' ? '160px' : 'none')
      : (f.k === 'number' ? '160px' : f.k === 'array' ? '320px'
        : (f.k === 'select' && !f.wide) ? '256px' : 'none');
    inner = '<label>' + mark(f.l, q) + '</label><div class="ctlrow">' +
      '<div class="ctl" style="max-width:' + cap + '">' + c + '</div>' + reset + '</div>';
  }
  return '<div class="row' + (dirty ? ' dirty' : '') + '">' + inner + hint + '</div>';
}

function panel(sec) {
  if (sec.id === 'live') {
    const knobs = sec.fields.map((f) => field(sec, f)).join('');
    if (isMobile())
      return '<div class="card"><div class="hint" style="margin:0 0 6px">Live preview</div>' +
        '<div class="video" style="margin-bottom:14px"></div>' +
        '<h3 style="margin-bottom:8px">Live adjustments</h3>' + knobs + '</div>';
    return '<div style="display:flex;gap:24px;align-items:flex-start">' +
      '<div style="flex:1 1 58%;min-width:0" class="card"><div class="hint" style="margin:0 0 6px">Live preview</div>' +
      '<div class="video"></div></div>' +
      '<div style="flex:1 1 42%;min-width:0" class="card"><h3>Live adjustments</h3>' + knobs + '</div></div>';
  }
  return '<div class="card"><h3>' + esc(sec.label) + '</h3><div class="mj-cols">' +
    sec.fields.map((f) => field(sec, f)).join('') + '</div></div>';
}

/* Save and Apply live together in the sticky bar. Today Save is pinned to the
   bottom while the "Apply now" banner appears at the top of the form
   (mj-settings.js: form.insertBefore(bar, form.children[1])), so applying a
   saved change means scrolling back up. */
function toolbar() {
  const n = Object.keys(S.dirty).length;
  /* one rule for both buttons: each is present only while its action is
     available, so the bar itself is absent until there is something to do */
  if (!n && !S.saved) return '';
  const msg = S.saved
    ? 'Saved. Resolution, codec and frame-rate changes need a pipeline reload.'
    : n + ' change' + (n === 1 ? '' : 's') + ' pending.';
  return '<div class="toolbar"><span>' + msg + '</span>' +
    (S.saved ? '<button class="btn warn" data-act="apply">Apply now</button>' : '') +
    (n ? '<button class="btn" data-act="save">Save Changes</button>' : '') + '</div>';
}

      '</span><span class="n">' + g.sections.length + '</span></div>' +
      (open ? '<div style="padding-left:13px">' + g.sections.map((s) => '<div class="navlink' +
        (s.id === S.active ? ' on' : '') + '" data-act="sec:' + esc(s.id) + '">' + esc(s.label) +
        '</div>').join('') + '</div>' : '') + '</div>';
  }).join('');
}

function renderDesktop() {
  const sec = find(S.active);
  let right = '';
  if (S.dir === 'B') {
    const g = MODEL.find((x) => x.id === S.cat) || MODEL[0];
    const all = S.active === '__all__';
    right += '<div class="tabs"><div class="tab' + (all ? ' on' : '') + '" data-act="sec:__all__">All</div>' +
      g.sections.map((s) => '<div class="tab' + (s.id === S.active ? ' on' : '') +
        '" data-act="sec:' + esc(s.id) + '">' + esc(s.label) + '</div>').join('') + '</div>';
    right += all
      ? g.sections.filter((s) => s.id !== 'live').map(panel).join('')
      : panel(g.sections.find((s) => s.id === S.active) || g.sections[0]);
  } else {
    right += panel(sec);
  }
  const navW = S.dir === 'A' ? 280 : S.dir === 'B' ? 260 : 300;
  return '<div class="mj" data-t="' + S.theme + '" style="width:1440px">' + CHROME() +
    '<div class="wrap"><h2>Majestic Settings</h2><div class="cols">' +
    '<div style="flex:0 0 ' + navW + 'px">' + sidebar() + '</div>' +
    '<div style="flex:1 1 auto;min-width:0">' + right + toolbar() + '</div>' +
    '</div></div></div>';
}

function renderMobile() {
  const sec = find(S.active);
  let body = '';
  if (S.dir === 'B') {
    const g = MODEL.find((x) => x.id === S.cat) || MODEL[0];
    body += SEARCH_BOX();
    if (S.q) body += RESULTS();
    else {
      body += '<div class="box" style="display:flex;align-items:center;margin-bottom:12px;cursor:pointer" data-act="catopen">' +
        '<span style="flex:1 1 auto">' + esc(g.label) + '</span>' +
        '<svg width="12" height="8" viewBox="0 0 12 8" fill="none" style="color:var(--sec-color)' +
        (S.catOpen ? ';transform:rotate(180deg)' : '') + '"><path d="M1 1.5 6 6.5 11 1.5" stroke="currentColor" ' +
        'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      if (S.catOpen)
        body += '<div style="margin:-6px 0 12px;border:1px solid var(--border);border-radius:8px;overflow:hidden">' +
          MODEL.map((x) => '<div style="display:flex;align-items:center;min-height:46px;padding:0 12px;cursor:pointer' +
            (x.id === S.cat ? ';background:var(--primary);color:#fff' : '') + '" data-act="cat:' + esc(x.id) + '">' +
            esc(x.label) + '</div>').join('') + '</div>';
      body += '<div class="tabs">' + g.sections.map((s) => '<div class="tab' +
        (s.id === S.active ? ' on' : '') + '" data-act="sec:' + esc(s.id) + '">' +
        esc(s.label) + '</div>').join('') + '</div>';
      body += panel(g.sections.find((s) => s.id === S.active) || g.sections[0]);
    }
    if (!S.q) body += toolbar();
  } else if (S.view === 'detail') {
    body += '<div class="back" data-act="back">' +
      '<svg width="8" height="12" viewBox="0 0 8 12" fill="none"><path d="M6.5 1 1.5 6 6.5 11" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      (S.dir === 'C' ? 'Search' : 'All settings') + '</div>' + panel(sec) + toolbar();
  } else {
    body += SEARCH_BOX();
    if (S.dir === 'A') {
      /* mobile keeps the same tree, but collapsed: the reporter asked for an
         accordion here and the full tree on desktop. A search auto-opens the
         categories that still have matches. */
      const q = q_();
      const t = filterTree(q);
      body += t.length ? t.map((x) => {
        const open = q ? true : !!S.openA[x.g.id];
        return '<div><div class="acc' + (open ? ' open' : '') + '" style="padding:9px 0" data-act="grpA:' +
          esc(x.g.id) + '"><span class="tri"></span><span>' + mark(x.g.label, q) +
          '</span><span class="n">' + x.sections.length + '</span></div>' +
          (open ? x.sections.map((sec) => {
            const n = q ? fieldMatches(sec, q) : nFields(sec);
            return '<div class="listrow" style="padding-left:16px" data-act="sec:' + esc(sec.id) +
              '"><b>' + mark(sec.label, q) + '</b>' + (n ? '<i>' + n + '</i>' : '') + chev + '</div>';
          }).join('') : '') +
          '</div>';
      }).join('') : '<div class="empty">Nothing matches “' + esc(S.q) + '”.</div>';
    } else if (S.q) {
      const h = hits();
      const secs = new Set(h.map((x) => x.s.id));
      body += '<div class="cap" style="padding:0">' + h.length +
        (h.length === 1 ? ' setting' : ' settings') + ' in ' + secs.size + ' sections</div>' +
        h.slice(0, 12).map((x) => '<div class="hitrow" data-act="sec:' + esc(x.s.id) + '">' +
          '<span style="flex:1 1 auto;min-width:0"><b>' + esc(x.f.l) + '</b><s>' +
          esc(x.g.label) + ' › ' + esc(x.s.label) + '</s></span>' + chev + '</div>').join('');
    } else {
      body += MODEL.map((g) => {
        const open = S.open === g.id;
        return '<div><div class="acc' + (open ? ' open' : '') + '" style="padding:7px 0" data-act="grp:' +
          esc(g.id) + '"><span class="tri"></span><span>' + esc(g.label) +
          '</span><span class="n">' + g.sections.length + '</span></div>' +
          (open ? '<div style="padding-left:16px">' + g.sections.map((s) =>
            '<div class="listrow" data-act="sec:' + esc(s.id) + '"><b>' + esc(s.label) + '</b>' + chev +
            '</div>').join('') + '</div>' : '') + '</div>';
      }).join('');
    }
  }
  return '<div class="mj m" data-t="' + S.theme + '" style="width:390px">' + CHROME() +
    '<div class="wrap" style="padding-bottom:20px"><h2>Majestic Settings</h2>' + body + '</div></div>';
}

function render() {
  const stage = document.getElementById('stage');
  const focus = document.activeElement && document.activeElement.id === 'q';
  const caret = focus ? document.activeElement.selectionStart : null;
  stage.innerHTML = isMobile() ? renderMobile() : renderDesktop();
  document.getElementById('note').innerHTML = NOTES[S.dir];
  if (focus) {
    const q = document.getElementById('q');
    if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

document.addEventListener('click', (ev) => {
  const seg = ev.target.closest('.seg button');
  if (seg) {
    const which = seg.parentElement.id;
    if (which === 'dir') { S.dir = seg.dataset.v; S.view = 'list'; S.catOpen = false;
      S.active = S.dir === 'C' ? 'video0' : 'isp'; S.q = S.dir === 'C' ? 'codec' : '';
      S.open = S.dir === 'C' ? 'video' : S.open; S.cat = groupOf(S.active).id; }
    if (which === 'dev') { S.dev = seg.dataset.v; S.view = 'list'; S.catOpen = false; }
    if (which !== 'thm') { S.dirty = {}; S.saved = false; }
    if (which === 'thm') S.theme = seg.dataset.v;
    [...seg.parentElement.children].forEach((b) =>
      b.setAttribute('aria-pressed', String(b === seg)));
    render();
    return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const [act, arg] = el.dataset.act.split(':');
  if (act === 'sec') {
    S.active = arg;
    if (arg !== '__all__') S.cat = groupOf(arg).id;
    if (isMobile() && S.dir !== 'B') S.view = 'detail';
  } else if (act === 'cat') {
    const g = MODEL.find((x) => x.id === arg);
    S.cat = arg; S.active = g.sections[0].id; S.catOpen = false;
  } else if (act === 'grp') {
    S.open = S.open === arg ? '' : arg;
  } else if (act === 'toggle') {
    const k = el.dataset.act.slice(7);
    const f = flat().flatMap((x) => x.s.fields.map((y) => ({ id: x.s.id, f: y })))
      .find((x) => x.id + '.' + x.f.n === k);
    if (S.dirty[k] !== undefined) delete S.dirty[k]; else S.dirty[k] = !(f && f.f.on);
  } else if (act === 'back') {
    S.view = 'list';
  } else if (act === 'catopen') {
    S.catOpen = !S.catOpen;
  } else if (act === 'clear') {
    S.q = '';
  } else if (act === 'grpA') {
    S.openA = Object.assign({}, S.openA);
    S.openA[arg] = !S.openA[arg];
  } else if (act === 'save') {
    if (Object.keys(S.dirty).length) { S.dirty = {}; S.saved = true; }
  } else if (act === 'apply') {
    S.saved = false;
  }
  render();
});

document.addEventListener('input', (ev) => {
  if (ev.target.id !== 'q') return;
  S.q = ev.target.value;
  render();
});

/* deep link: #<dir>/<device>/<theme>, e.g. #B/m/dark — so a link can point
   straight at one variant; a 4th segment presets the search box */
function applyHash() {
  const p = location.hash.replace('#', '').split('/');
  if (['A', 'B', 'C'].includes(p[0])) S.dir = p[0];
  if (['d', 'm'].includes(p[1])) S.dev = p[1];
  if (['dark', 'light'].includes(p[2])) S.theme = p[2];
  S.active = S.dir === 'C' ? 'video0' : 'isp';
  S.q = p[3] !== undefined && p[3] !== '' ? decodeURIComponent(p[3]) : (S.dir === 'C' ? 'codec' : '');
  if (p[4]) { const m = flat().find((x) => x.s.id === p[4]); if (m) S.active = m.s.id; }
  S.cat = groupOf(S.active).id;
  S.view = 'list'; S.dirty = {};
  S.saved = p[5] === 'saved';
  const set = (id, v) => [...document.getElementById(id).children].forEach(
    (b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  set('dir', S.dir); set('dev', S.dev); set('thm', S.theme);
}

window.addEventListener('hashchange', () => { applyHash(); render(); });
applyHash();
render();
</script>
</body>
</html>
