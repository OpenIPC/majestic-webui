<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="darkreader-lock">
	<meta http-equiv="cache-control" content="no-store">
	<title>Set up your camera · OpenIPC</title>
	<!-- Self-contained for the same reason login.html is, and rather more so:
	     this page is what an unclaimed camera answers with, and an unclaimed
	     camera serves nothing else at all — no /a/*.css, no /a/*.js, no CGI.
	     Everything the page needs is in this file.

	     majestic stops serving it the moment root has a password, so there is
	     no "already set up" state to handle here: that request is a 404 — and
	     this page is the one thing on the camera that must not be shown from a
	     cache after that, since the form it offers can no longer succeed.
	     majestic sends Cache-Control: no-cache with it, which covers a reload;
	     the no-store above and the pageshow handler below cover the back-forward
	     cache, which a revalidation directive does not reach. -->
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh;
			display: flex; align-items: center; justify-content: center;
			background: #1a1d20; color: #dee2e6;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		.card {
			width: 100%; max-width: 24rem; margin: 1rem;
			background: #212529; border: 1px solid #343a40; border-radius: .5rem;
			padding: 2rem 1.75rem;
		}
		h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .35rem; text-align: center; }
		h1 span { color: #6ea8fe; }
		.lede {
			margin: 0 0 1.25rem; font-size: .875rem; line-height: 1.45;
			color: #adb5bd; text-align: center;
		}
		.host {
			display: block; margin-top: .35rem;
			font-family: ui-monospace, "PT Mono", monospace; color: #dee2e6;
			overflow-wrap: anywhere;
		}
		label { display: block; font-size: .875rem; margin: 0 0 .35rem; color: #adb5bd; }
		input {
			width: 100%; padding: .5rem .75rem; margin-bottom: 1rem;
			background: #2b3035; color: #dee2e6;
			border: 1px solid #495057; border-radius: .375rem; font-size: 1rem;
		}
		input:focus { outline: none; border-color: #6ea8fe; box-shadow: 0 0 0 .2rem rgba(110,168,254,.25); }
		.check {
			display: flex; align-items: center; gap: .5rem;
			margin-bottom: 1rem; font-size: .875rem; color: #adb5bd; cursor: pointer;
		}
		/* Same reset login.html needs: the global input rule above is written for
		   text fields, and a checkbox inheriting it renders as a padded dark box
		   on engines that honour those properties on checkboxes. */
		.check input {
			width: 1rem; height: 1rem; flex: none; margin: 0; padding: 0;
			background: none; border: 0; border-radius: 0; box-shadow: none;
			accent-color: #0d6efd;
		}
		button {
			width: 100%; padding: .5rem .75rem;
			background: #0d6efd; color: #fff; border: 0; border-radius: .375rem;
			font-size: 1rem; font-weight: 500; cursor: pointer;
		}
		button:hover { background: #0b5ed7; }
		button:disabled { opacity: .65; cursor: default; }
		.alert {
			display: none; margin-bottom: 1rem; padding: .6rem .75rem;
			background: #2c0b0e; color: #ea868f;
			border: 1px solid #842029; border-radius: .375rem; font-size: .875rem;
		}
		.alert.show { display: block; }
		.hint {
			margin: -.5rem 0 1.25rem; font-size: .8125rem; line-height: 1.45;
			color: #6c757d;
		}
	</style>
</head>
<body>
	<!-- One form for both worlds: with script it posts through fetch and stays
	     on the page to report a problem; without, the browser posts it directly
	     and majestic answers 303 to the status page. -->
	<form class="card" id="setup" method="post" action="/setup" autocomplete="on">
		<h1>Open<span>IPC</span></h1>
		<p class="lede">
			This camera has not been set up yet. Choose a password to claim it.
			<span class="host" id="host"></span>
		</p>
		<div class="alert" id="err" role="alert"></div>
		<label for="password">Password</label>
		<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
		<label for="confirm">Confirm password</label>
		<input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
		<label class="check"><input id="show" type="checkbox"> Show password</label>
		<p class="hint">
			This is the camera's <strong>root</strong> password. It is the one
			password the camera has: the web interface, SSH, RTSP and ONVIF all
			check it. Until it is set the camera streams nothing.
		</p>
		<!-- EULA acknowledgement goes here when the text is published: a
		     <label class="check"> holding a required checkbox named "eula" and a
		     link to /eula.txt (shipped in the image, read from the camera — this
		     page must not fetch anything off-device), and the matching required
		     check on the server side in on_setup(). Deliberately not shipped
		     ahead of the document itself; a checkbox pointing at nothing is
		     worse than no checkbox. -->
		<button id="submit" type="submit">Set password</button>
	</form>
	<script>
		(function () {
			var form = document.getElementById('setup');
			var err = document.getElementById('err');
			var btn = document.getElementById('submit');
			var pw = document.getElementById('password');
			var cf = document.getElementById('confirm');

			// Which camera is being claimed. Worth saying out loud: an unclaimed
			// camera is usually one of several on a bench, all answering to
			// addresses nobody has named yet.
			document.getElementById('host').textContent = location.host;

			document.getElementById('show').addEventListener('change', function () {
				var t = this.checked ? 'text' : 'password';
				pw.type = t;
				cf.type = t;
			});

			function fail(msg) {
				err.textContent = msg;
				err.classList.add('show');
				btn.disabled = false;
			}

			// Restored from the back-forward cache, this page is a form that
			// cannot succeed any more: the camera has an owner and /setup
			// answers 403. bfcache hands back the painted page without asking
			// the server anything, so no cache header prevents this on its own
			// — the page has to notice for itself.
			//
			// Only on a restore (event.persisted), and only the Back button can
			// produce one: a successful claim leaves through location.replace(),
			// which drops this page from history rather than stacking on it. The
			// path that does stack is the <noscript> form, whose POST is answered
			// 303 — and a browser without script never runs this either. What is
			// left is the ordinary Back after a redirect, and a camera somebody
			// else claimed while this tab sat open.
			window.addEventListener('pageshow', function (ev) {
				if (!ev.persisted) return;
				fetch('/setup.html', { method: 'HEAD', credentials: 'same-origin' })
					.then(function (r) {
						if (!r.ok) location.replace('/cgi-bin/status.cgi');
					})
					.catch(function () { /* camera unreachable: leave the form */ });
			});

			form.addEventListener('submit', function (ev) {
				ev.preventDefault();
				err.classList.remove('show');

				// Checked here only to answer instantly; the server checks both
				// again and is the one that decides. Keeping the wording identical
				// means a rule that ever drifts reads the same either way.
				if (pw.value !== cf.value) return fail('The two passwords do not match.');
				if (pw.value.length < 8) return fail('Password must be at least 8 characters long.');

				btn.disabled = true;
				fetch('/setup', {
					method: 'POST',
					credentials: 'same-origin',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: 'password=' + encodeURIComponent(pw.value) +
					      '&confirm=' + encodeURIComponent(cf.value)
				}).then(function (r) {
					if (r.ok) {
						// Signed in already — /setup minted the session on its way
						// out, so the status page opens without a second sign-in.
						// replace(), not href: this page no longer exists on the
						// camera, and leaving it in history means Back lands on a
						// 404.
						location.replace('/cgi-bin/status.cgi');
						return;
					}
					// The endpoint answers in plain text and says something useful
					// (too short, no match, could not be saved), so show what it
					// said rather than inventing a message from the status code.
					r.text().then(function (t) {
						fail(t.trim() || ('Setup failed (' + r.status + '). Please try again.'));
					}).catch(function () {
						fail('Setup failed (' + r.status + '). Please try again.');
					});
				}).catch(function () {
					fail('Could not reach the camera. Check your connection.');
				});
			});
		})();
	</script>
</body>
</html>
