<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="darkreader-lock">
	<title>Sign in · OpenIPC</title>
	<!-- Self-contained on purpose: this page is served without authentication
	     (majestic redirects unauthenticated browsers here), so it cannot pull
	     /a/*.css or /a/*.js, which require a valid session. -->
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh;
			display: flex; align-items: center; justify-content: center;
			background: #1a1d20; color: #dee2e6;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		.card {
			width: 100%; max-width: 22rem; margin: 1rem;
			background: #212529; border: 1px solid #343a40; border-radius: .5rem;
			padding: 2rem 1.75rem;
		}
		h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.5rem; text-align: center; }
		h1 span { color: #6ea8fe; }
		label { display: block; font-size: .875rem; margin: 0 0 .35rem; color: #adb5bd; }
		input {
			width: 100%; padding: .5rem .75rem; margin-bottom: 1rem;
			background: #2b3035; color: #dee2e6;
			border: 1px solid #495057; border-radius: .375rem; font-size: 1rem;
		}
		input:focus { outline: none; border-color: #6ea8fe; box-shadow: 0 0 0 .2rem rgba(110,168,254,.25); }
		.check {
			display: flex; align-items: center; gap: .5rem;
			margin-bottom: 1rem; font-size: .875rem; color: #adb5bd; cursor: pointer;
		}
		/* The global input rule above styles text fields (full width, padding,
		   dark background, border). A checkbox inheriting it renders as a padded
		   dark box on engines that honour those properties on checkboxes, so
		   every inherited property is reset here, not just width/margin. */
		.check input {
			width: 1rem; height: 1rem; flex: none; margin: 0; padding: 0;
			background: none; border: 0; border-radius: 0; box-shadow: none;
			accent-color: #0d6efd;
		}
		button {
			width: 100%; padding: .5rem .75rem;
			background: #0d6efd; color: #fff; border: 0; border-radius: .375rem;
			font-size: 1rem; font-weight: 500; cursor: pointer;
		}
		button:hover { background: #0b5ed7; }
		button:disabled { opacity: .65; cursor: default; }
		.alert {
			display: none; margin-bottom: 1rem; padding: .6rem .75rem;
			background: #2c0b0e; color: #ea868f;
			border: 1px solid #842029; border-radius: .375rem; font-size: .875rem;
		}
		.alert.show { display: block; }
		/* Held back until the already-signed-in probe below has had its say, so a
		   browser that arrives here holding a good session never paints a sign-in
		   form it is about to be redirected away from. Current majestic decides
		   this before the page is sent and this never matters; it is what stops
		   the flash on a camera whose majestic predates that. */
		#login[hidden] { display: none; }
	</style>
	<noscript>
		<!-- No script means no probe to wait for, and no redirect either. The
		     form is all there is, so show it. -->
		<style>#login[hidden] { display: block; }</style>
	</noscript>
</head>
<body>
	<form class="card" id="login" autocomplete="on" hidden>
		<h1>Open<span>IPC</span></h1>
		<div class="alert" id="err" role="alert"></div>
		<label for="username">Username</label>
		<input id="username" name="username" value="root" autocapitalize="none" autocomplete="username" spellcheck="false">
		<label for="password">Password</label>
		<input id="password" name="password" type="password" autocomplete="current-password" autofocus>
		<!-- Sets a persistent token so a majestic restart (firmware upgrade,
		     reboot) recovers the session silently instead of landing back here.
		     Server-side feature: older majestic ignores the extra field. -->
		<label class="check"><input id="remember" name="remember" type="checkbox"> Stay signed in on this device</label>
		<button id="submit" type="submit">Sign in</button>
	</form>
	<script>
		(function () {
			var form = document.getElementById('login');
			var err = document.getElementById('err');
			var btn = document.getElementById('submit');

			// Where to land after a successful login. Only accept a same-origin
			// absolute path — never a protocol-relative ("//host") or scheme URL,
			// which would turn ?next= into an open redirect.
			function safeNext() {
				var raw = new URLSearchParams(location.search).get('next');
				if (!raw) return '/cgi-bin/status.cgi';
				if (raw.charAt(0) !== '/' || raw.charAt(1) === '/' || raw.indexOf('\\') !== -1) {
					return '/cgi-bin/status.cgi';
				}
				// Never point back at this page. The already-signed-in check below
				// acts on it, so a ?next= aimed here would spin: probe says OK,
				// replace() lands here again, probe says OK…
				if (raw.split(/[?#]/)[0] === location.pathname) {
					return '/cgi-bin/status.cgi';
				}
				return raw;
			}

			function fail(msg) {
				err.textContent = msg;
				err.classList.add('show');
				btn.disabled = false;
			}

			// Nothing to ask for if the session is already good. This page can be
			// reached holding a valid one from a bookmark, the Back button, or a
			// restored tab — Safari's History > Recently Closed Tabs reopens the
			// URL the tab last held, and before the replace() below that was this
			// page, so signing in landed the user right back on the sign-in form
			// (issue #120).
			//
			// Asks as a NAVIGATION (Accept: text/html) with redirect: 'manual', so a
			// logged-out camera answers 302 to this very page rather than 401. That
			// matters for the dialog: an older majestic decides whether to send
			// WWW-Authenticate from Sec-Fetch-Dest alone, which JS cannot set and
			// Safari below 16.4 does not send — asking as a plain fetch would raise
			// the native prompt on the sign-in page itself against such a build. The
			// redirect branch is taken by every version, so this never can.
			//
			// A 3xx arrives as an opaque redirect: status 0, ok false. Only a real
			// 200 means the session is live.
			// Reveal the form only once the probe has ruled out "already signed
			// in". Anything but a live session shows it — including a camera that
			// cannot be reached at all, where the form is the only useful thing
			// this page has. The timer is the backstop: a probe that neither
			// resolves nor rejects (a half-open socket to a rebooting camera) must
			// not leave a blank card on screen for ever.
			var shown = false;
			function showForm() {
				if (shown) return;
				shown = true;
				form.hidden = false;
				// autofocus is evaluated at parse time, when the form was hidden.
				document.getElementById('password').focus();
			}
			var revealTimer = setTimeout(showForm, 1500);

			fetch('/cgi-bin/j/pulse.cgi', {
				credentials: 'same-origin',
				redirect: 'manual',
				headers: { 'Accept': 'text/html' }
			}).then(function (r) {
				if (r.ok) {
					// Signed in already — leave the form hidden, we are navigating.
					clearTimeout(revealTimer);
					location.replace(safeNext());
					return;
				}
				showForm();
			}).catch(function () { /* offline: show the form */ showForm(); });

			form.addEventListener('submit', function (ev) {
				ev.preventDefault();
				err.classList.remove('show');
				btn.disabled = true;

				var u = document.getElementById('username').value;
				var p = document.getElementById('password').value;
				var body = 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p);
				if (document.getElementById('remember').checked) body += '&remember=1';

				fetch('/login', {
					method: 'POST',
					credentials: 'same-origin',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: body
				}).then(function (r) {
					if (r.ok) {
						// replace(), not href: this page has served its purpose, and
						// leaving it in the tab's history is what let a restored tab
						// or Back put the sign-in form back in front of a user who is
						// already signed in (issue #120). apiFetch() takes the same
						// care for the same reason.
						location.replace(safeNext());
					} else if (r.status === 403) {
						fail('Invalid username or password.');
					} else {
						fail('Sign in failed (' + r.status + '). Please try again.');
					}
				}).catch(function () {
					fail('Could not reach the camera. Check your connection.');
				});
			});
		})();
	</script>
</body>
</html>
